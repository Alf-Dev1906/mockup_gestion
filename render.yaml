services:
  - type: web
    name: mockup-gestion-backend
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_NAME
        value: SGE
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://mockup-gestion-backend.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: ${{ mysql.MYSQL_HOST }}
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: ${{ mysql.MYSQL_DATABASE }}
      - key: DB_USERNAME
        value: ${{ mysql.MYSQL_USERNAME }}
      - key: DB_PASSWORD
        value: ${{ mysql.MYSQL_PASSWORD }}
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: cookie
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: single

databases:
  - name: mockup-gestion-mysql
    databaseName: sge_db
    user: sge_user
    plan: free
