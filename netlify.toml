[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 5173

[context.production.environment]
  VITE_API_BASE_URL = "https://mockup-gestion-backend.onrender.com/api"

[context.preview.environment]
  VITE_API_BASE_URL = "https://mockup-gestion-backend.onrender.com/api"

[context.deploy-preview.environment]
  VITE_API_BASE_URL = "https://mockup-gestion-backend.onrender.com/api"
